# Shipped defaults for every setting org.doscolas.config.AppConfig reads via Env.get*, loaded
# once at startup by org.doscolas.config.ConfigFile (see that class's javadoc for the full lookup
# order). A real environment variable with the same name (e.g. DB_URL) always wins over whatever
# is here.
#
# To override without rebuilding the jar: drop your own config.yml next to it (in the working
# directory) or point CONFIG_FILE at any path — same pattern as logging.yml/LOGGING_CONFIG_FILE.
# Do that for anything secret (DB_PASSWORD, JWT_SECRET, FINTOC_*, SMTP_PASSWORD) rather than
# editing this shipped copy, since it's checked into git.
#
# Grouping below (server:, database:, ...) is purely for readability - each leaf key is the env
# var name it stands in for, and lookup ignores the nesting.

